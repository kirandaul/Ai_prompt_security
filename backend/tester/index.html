<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cybage Detector Testing Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --crit: #dc2626; --high: #ea580c; --med: #ca8a04; --low: #2563eb; --safe: #16a34a;
            --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --accent: #6366f1;
            --bg: #f4f6fb; --panel: #ffffff;
        }
        body {
            margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--ink); background: var(--bg); padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
        }
        .header h1 { margin: 0; font-size: 24px; display: flex; align-items: center; gap: 10px; }
        .header p { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
        
        .controls {
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
            margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--line);
        }
        .btn {
            cursor: pointer; border: 1px solid var(--line); background: var(--panel);
            color: var(--ink); padding: 10px 16px; border-radius: 8px; font-size: 13px;
            transition: .15s; font-weight: 500;
        }
        .btn:hover { background: #f8fafc; border-color: #cbd5e1; }
        .btn.primary {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border: 0; color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,.3);
        }
        .btn.primary:hover { box-shadow: 0 6px 16px rgba(99,102,241,.4); }
        .btn.danger { color: var(--crit); border-color: var(--crit); }
        .btn.danger:hover { background: #fee2e2; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .search-bar {
            display: flex; gap: 10px; flex: 1; min-width: 300px;
        }
        .search-bar input, .search-bar select {
            flex: 1; padding: 8px 12px; border: 1px solid var(--line);
            border-radius: 8px; font-size: 13px; outline: none;
        }
        .search-bar input:focus, .search-bar select:focus {
            border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.12);
        }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
        
        .card {
            background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
        }
        .card h2 { margin: 0 0 12px; font-size: 16px; color: var(--ink); }
        
        .prompt-list {
            border: 1px solid var(--line); border-radius: 8px; max-height: 500px;
            overflow-y: auto; background: var(--panel);
        }
        .prompt-item {
            padding: 12px; border-bottom: 1px solid var(--line);
            cursor: pointer; transition: .1s; font-size: 13px;
        }
        .prompt-item:hover { background: #f8fafc; }
        .prompt-item.selected { background: #eef2ff; border-left: 3px solid var(--accent); }
        .prompt-name { font-weight: 600; color: var(--ink); }
        .prompt-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
        
        .details { }
        .detail-row { margin-bottom: 12px; }
        .detail-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
        .detail-value { font-size: 13px; color: var(--ink); margin-top: 3px; word-break: break-all; }
        .detail-value.mono { font-family: ui-monospace, Menlo, Consolas; }
        
        .response-box {
            background: #f8fafc; border: 1px solid var(--line); border-radius: 8px;
            padding: 12px; font-size: 12px; font-family: ui-monospace; max-height: 300px;
            overflow-y: auto; color: var(--ink); line-height: 1.5;
        }
        
        .findings {
            border: 1px solid var(--line); border-radius: 8px; padding: 12px;
            background: var(--panel);
        }
        .finding-item {
            border-left: 3px solid var(--line); padding: 10px 12px; margin-bottom: 8px;
            background: #f8fafc; border-radius: 4px;
        }
        .finding-item.CRITICAL { border-left-color: var(--crit); background: #fee2e2; }
        .finding-item.HIGH { border-left-color: var(--high); background: #ffedd5; }
        .finding-item.MEDIUM { border-left-color: var(--med); background: #fef9c3; }
        .finding-item.LOW { border-left-color: var(--low); background: #dbeafe; }
        .finding-item.SAFE { border-left-color: var(--safe); background: #dcfce7; }
        
        .summary {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px; margin-top: 12px;
        }
        .summary-card {
            border: 1px solid var(--line); border-radius: 8px; padding: 12px;
            text-align: center; background: #f8fafc;
        }
        .summary-label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
        .summary-value { font-size: 20px; font-weight: 700; color: var(--ink); margin-top: 4px; }
        
        .badge {
            display: inline-block; font-size: 11px; padding: 3px 8px;
            border-radius: 999px; font-weight: 600; margin-right: 6px; margin-bottom: 4px;
        }
        .badge.PASS { background: #dcfce7; color: #15803d; }
        .badge.FAIL { background: #fee2e2; color: #b91c1c; }
        .badge.RUNNING { background: #dbeafe; color: #1d4ed8; }
        
        .progress-bar {
            width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px;
            overflow: hidden; margin-top: 8px;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, var(--accent), #8b5cf6);
            transition: width .3s;
        }
        
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px; margin-top: 12px;
        }
        .stat {
            border: 1px solid var(--line); border-radius: 8px; padding: 12px;
            text-align: center; background: #f8fafc;
        }
        .stat-label { font-size: 12px; color: var(--muted); }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--ink); margin-top: 4px; }
        
        .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
        .error { color: var(--crit); padding: 12px; background: #fee2e2; border-radius: 8px; margin-bottom: 12px; }
        .success { color: var(--safe); padding: 12px; background: #dcfce7; border-radius: 8px; margin-bottom: 12px; }
        
        .spinner {
            display: inline-block; width: 16px; height: 16px; border: 2px solid #e2e8f0;
            border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .tabs {
            display: flex; gap: 8px; border-bottom: 1px solid var(--line); margin-bottom: 12px;
        }
        .tab {
            padding: 10px 16px; cursor: pointer; border: none; background: none;
            color: var(--muted); border-bottom: 2px solid transparent; font-size: 13px;
            font-weight: 500; transition: .1s;
        }
        .tab:hover { color: var(--ink); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Detector Testing Dashboard</h1>
            <p>Run and validate detector patterns against test prompts</p>
            
            <div class="controls">
                <button class="btn primary" id="runBtn">▶ Run Test</button>
                <button class="btn primary" id="runAllBtn">⚡ Run All Tests</button>
                <button class="btn" id="exportBtn">📥 Export Results</button>
                <button class="btn" id="exportFailedBtn">📋 Export Failed Tests</button>
                <button class="btn" id="clearBtn">🗑 Clear Results</button>
                
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search prompts..." />
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                        <option value="SECRET">Secrets</option>
                        <option value="PII">PII</option>
                        <option value="ATTACK">Attacks</option>
                        <option value="ENTERPRISE">Enterprise</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="grid">
            <!-- Left column: Prompts list -->
            <div class="card">
                <h2>Test Prompts (<span id="promptCount">0</span>)</h2>
                <div class="prompt-list" id="promptList"></div>
            </div>
            
            <!-- Right column: Details & Results -->
            <div>
                <div class="card">
                    <h2>Prompt Details</h2>
                    <div id="detailsPanel" class="empty">Select a prompt to view details</div>
                </div>
                
                <div class="card" style="margin-top: 20px;">
                    <h2>Test Results</h2>
                    <div id="resultsPanel" class="empty">Run a test to see results</div>
                </div>
            </div>
        </div>
        
        <!-- Bulk test progress -->
        <div class="card" id="bulkPanel" style="display: none;">
            <h2>Bulk Test Progress</h2>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px;">
                <span id="progressText">0/0</span>
                <span id="progressStatus" style="color: var(--muted);">Initializing...</span>
            </div>
            <div class="summary" id="bulkStats" style="margin-top: 15px;">
                <div class="summary-card">
                    <div class="summary-label">Total</div>
                    <div class="summary-value" id="bulkTotal">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Passed</div>
                    <div class="summary-value" id="bulkPassed" style="color: var(--safe);">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Failed</div>
                    <div class="summary-value" id="bulkFailed" style="color: var(--crit);">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Pass Rate</div>
                    <div class="summary-value" id="bulkRate">0%</div>
                </div>
            </div>
        </div>
        
        <!-- Final stats -->
        <div class="card" id="statsCard" style="display: none; margin-top: 20px;">
            <h2>Test Summary</h2>
            <div class="stats-grid" id="statsGrid"></div>
        </div>
    </div>

    <script src="prompts.js"></script>
    <script src="app.js"></script>
</body>
</html>
